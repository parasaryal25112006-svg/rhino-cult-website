<title>Rhino Cult Logo Animation</title>

<style>
/* Layout: one centered stage, logo mark above a spaced wordmark, replay control below. Single dark look by choice. */
:root {
  --bg: #4a2e14;
  --bg-glow: #6e4724;
  --metal-lo: #8f8f8f;
  --metal-mid: #dcdcdc;
  --metal-hi: #ffffff;
  --line: #ecdcc2;
  --muted: #c9b08c;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% 44%, var(--bg-glow) 0%, var(--bg) 70%);
  color: var(--line);
  font-family: var(--display);
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
}
.stage { width: min(100%, 1100px); min-width: 0; }
svg { display: block; width: 100%; height: auto; max-height: calc(100vh - 110px); overflow: visible; }
.word { font-family: var(--display); font-weight: 800; font-size: 62px; fill: var(--line); text-anchor: middle; letter-spacing: 0.42em; }
.replay {
  font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--muted); background: transparent; border: 1px solid rgba(236,220,194,.35);
  padding: 10px 22px; cursor: pointer; transition: color .2s, border-color .2s, background .2s;
}
.replay:hover { color: var(--line); border-color: var(--line); background: rgba(236,220,194,.08); }
.replay:focus-visible { outline: 2px solid var(--line); outline-offset: 3px; }

/* ---- intro (plays once) ---- */
.outline { fill: none; stroke: var(--line); stroke-width: 3; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 0; opacity: 0; }
.rhino { opacity: 1; transform-origin: 800px 600px; }
.ground { transform-origin: 800px 812px; opacity: .55; }
.rule { transform-origin: 800px 868px; }
.word { opacity: 1; }
.shine { opacity: 0; }

.play .outline { animation: draw 1.9s cubic-bezier(.6,.05,.3,1) .3s both, outline-out .7s ease 2.2s forwards; }
.play .rhino { opacity: 0; animation: rise 1.1s cubic-bezier(.2,.7,.2,1) 1.9s forwards; }
.play .ground { transform: scaleX(0); animation: ground 1s ease 1.9s forwards; }
.play .rule { transform: scaleX(0); animation: grow 1s cubic-bezier(.6,.05,.3,1) 2.8s forwards; }
.play .word { opacity: 0; animation: word 1.3s cubic-bezier(.2,.7,.2,1) 3.0s forwards; }
.play .shine { animation: sweep 7s ease-in-out 3.2s infinite; }

@keyframes draw { from { opacity: 1; stroke-dashoffset: 1; } to { opacity: 1; stroke-dashoffset: 0; } }
@keyframes outline-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes ground { to { transform: scaleX(1); } }
@keyframes grow { to { transform: scaleX(1); } }
@keyframes word { from { opacity: 0; letter-spacing: 0.75em; } to { opacity: 1; letter-spacing: 0.42em; } }
@keyframes sweep {
  0% { opacity: 0; transform: translateX(0); }
  4% { opacity: 1; }
  24% { opacity: 1; transform: translateX(1150px); }
  25%, 100% { opacity: 0; transform: translateX(1150px); }
}
@media (prefers-reduced-motion: reduce) {
  .play .outline { animation: none; opacity: 0; }
  .play .rhino, .play .word { animation: none; opacity: 1; }
  .play .ground { animation: none; transform: none; }
  .play .rule { animation: none; transform: none; }
  .play .shine { animation: none; opacity: 0; }
}
</style>
